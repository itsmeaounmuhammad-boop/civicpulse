name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/civicpulse-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/civicpulse-frontend

jobs:
  test:
    # Re-run the full suite on the merged result — a PR's checks ran against
    # a pre-merge commit; this is what's actually about to be deployed.
    uses: ./.github/workflows/ci.yml

  build-push:
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      backend_digest: ${{ steps.backend_build.outputs.digest }}
      frontend_digest: ${{ steps.frontend_build.outputs.digest }}
      sha_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        id: backend_build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend
        id: frontend_build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.17.9

      - name: SBOM — backend
        run: syft ${{ env.BACKEND_IMAGE }}:${{ github.sha }} -o spdx-json > backend-sbom.json

      - name: SBOM — frontend
        run: syft ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} -o spdx-json > frontend-sbom.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sboms-${{ github.sha }}
          path: |
            backend-sbom.json
            frontend-sbom.json

  deploy-k8s:
    runs-on: ubuntu-latest
    needs: [build-push]
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: civicpulse-ci
          config: k8s/kind-config.yaml

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Install NGINX ingress controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=180s

      - name: Debug ingress on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl describe pod -n ingress-nginx -l app.kubernetes.io/component=controller

      - name: Set real values in prod overlay
        working-directory: k8s/overlays/prod
        run: |
          kustomize edit set image \
            ghcr.io/PLACEHOLDER/civicpulse-backend=${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ghcr.io/PLACEHOLDER/civicpulse-frontend=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Create image pull secret (private GHCR packages)
        run: |
          kubectl create namespace civicpulse --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace civicpulse \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }}

      - name: Apply manifests
        run: kubectl apply -k k8s/overlays/prod

      - name: Wait for migration and rollout
        run: |
          kubectl wait --for=condition=complete job/backend-migrate -n civicpulse --timeout=180s
          kubectl rollout status deployment/backend -n civicpulse --timeout=180s
          kubectl rollout status deployment/frontend -n civicpulse --timeout=180s

      - name: Debug on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl logs job/backend-migrate -n civicpulse || true
          kubectl logs deployment/backend -n civicpulse --tail=50 || true

      - name: Smoke test via port-forward
        run: |
          set -euo pipefail

          kubectl port-forward -n civicpulse svc/frontend 8080:8080 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT

          # Poll until the tunnel actually accepts connections (no fixed sleep).
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          echo "--- /healthz ---"
          curl -sSf http://localhost:8080/healthz

          echo
          echo "--- /api/stats ---"
          curl -sSf http://localhost:8080/api/stats | tee /tmp/stats.json

      - name: Print HPA state
        run: kubectl get hpa -n civicpulse