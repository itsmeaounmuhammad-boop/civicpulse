name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: ruff
        working-directory: backend
        run: ruff check .

      - name: mypy
        working-directory: backend
        run: mypy app

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: eslint
        working-directory: frontend
        run: npm run lint

      - name: tsc --noEmit
        working-directory: frontend
        run: npm run typecheck

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: civicpulse
          POSTGRES_PASSWORD: civicpulse
          POSTGRES_DB: civicpulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U civicpulse -d civicpulse_test"
          --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.4.1-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      TRIAGE_PROVIDER: simulated
      TEST_DATABASE_URL: postgresql+asyncpg://civicpulse:civicpulse@localhost:5432/civicpulse_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: pytest with coverage
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=65

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Vitest
        working-directory: frontend
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-type, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t civicpulse-backend:ci ./backend --target runtime

      - name: Build frontend image
        run: docker build -t civicpulse-frontend:ci ./frontend

      - name: Report image sizes
        run: |
          docker images civicpulse-backend:ci --format "{{.Repository}}: {{.Size}}"
          docker images civicpulse-frontend:ci --format "{{.Repository}}: {{.Size}}"

  scan:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t civicpulse-backend:ci ./backend --target runtime

      - name: Build frontend image
        run: docker build -t civicpulse-frontend:ci ./frontend

      - name: Trivy scan — backend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: civicpulse-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy scan — frontend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: civicpulse-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Build prod overlay
        env:
          GHCR_NAMESPACE: placeholder
          IMAGE_TAG: placeholder
        run: |
          cd k8s/overlays/prod
          kustomize edit set image ghcr.io/PLACEHOLDER/civicpulse-backend=ghcr.io/placeholder/civicpulse-backend:placeholder
          kustomize edit set image ghcr.io/PLACEHOLDER/civicpulse-frontend=ghcr.io/placeholder/civicpulse-frontend:placeholder
          kustomize build . > /tmp/prod-manifests.yaml

      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -summary -strict /tmp/prod-manifests.yaml

  integration:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for compose
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=civicpulse
          POSTGRES_PASSWORD=civicpulse
          POSTGRES_DB=civicpulse
          TRIAGE_PROVIDER=simulated
          EOF

      - name: docker compose up
        run: docker compose up -d --build

      - name: Wait for /ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ready; then exit 0; fi
            sleep 2
          done
          echo "backend never became ready"; exit 1

      - name: POST a complaint
        run: |
          RESPONSE=$(curl -sf -X POST http://localhost:8000/api/complaints \
            -H "Content-Type: application/json" \
            -d '{"text":"Integration test complaint about a burst water main","location":"Test Street"}')
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"open"'
          COMPLAINT_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "COMPLAINT_ID=$COMPLAINT_ID" >> "$GITHUB_ENV"

      - name: GET it back
        run: curl -sf http://localhost:8000/api/complaints/${{ env.COMPLAINT_ID }} | grep -q '"status":"open"'

      - name: Stats cache MISS then HIT
        run: |
          curl -sf -D /tmp/h1.txt -o /dev/null http://localhost:8000/api/stats
          grep -qi "x-cache: MISS" /tmp/h1.txt || echo "note: cache may already be warm"
          curl -sf -D /tmp/h2.txt -o /dev/null http://localhost:8000/api/stats
          grep -qi "x-cache: HIT" /tmp/h2.txt

      - name: Tear down
        if: always()
        run: docker compose down -v