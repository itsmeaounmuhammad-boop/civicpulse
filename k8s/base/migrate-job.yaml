apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: civicpulse
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/PLACEHOLDER/civicpulse-backend:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets